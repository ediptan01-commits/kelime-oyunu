name: Android APK + AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.teknolojix --project-name kelime_rotalari .
      - name: Set Android display name
        run: sed -i 's/android:label="kelime_rotalari"/android:label="Kelime Bul"/' android/app/src/main/AndroidManifest.xml
      - name: Get packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Build AAB
        run: flutter build appbundle --release
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: kelime-rotalari-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish AAB
        uses: actions/upload-artifact@v4
        with:
          name: kelime-rotalari-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
