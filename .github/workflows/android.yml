name: Android APK + AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.teknolojix --project-name kelime_rotalari .
      - name: Set Android display name
        run: sed -i 's/android:label="kelime_rotalari"/android:label="Kelime Bul"/' android/app/src/main/AndroidManifest.xml
      - name: Download licensed photographic backgrounds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/backgrounds
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 120 -A "KelimeBulGame/1.0 (Wikimedia Commons attribution)" \
            "https://upload.wikimedia.org/wikipedia/commons/1/11/Al-Kaaba_in_Mecca.jpg" -o assets/backgrounds/kaaba.jpg
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 120 -A "KelimeBulGame/1.0 (Wikimedia Commons attribution)" \
            "https://upload.wikimedia.org/wikipedia/commons/9/9a/Sultan_Ahmed_Mosque_-_Istanbul.jpg" -o assets/backgrounds/mosque.jpg
          test "$(stat -c%s assets/backgrounds/kaaba.jpg)" -gt 10000
          test "$(stat -c%s assets/backgrounds/mosque.jpg)" -gt 10000
      - name: Get packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Build AAB
        run: flutter build appbundle --release
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: kelime-rotalari-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish AAB
        uses: actions/upload-artifact@v4
        with:
          name: kelime-rotalari-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
