name: Android APK + AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.teknolojix --project-name kelime_rotalari .
      - name: Set Android display name
        run: sed -i 's/android:label="kelime_rotalari"/android:label="Kelime Bul"/' android/app/src/main/AndroidManifest.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install graphics dependency
        run: python -m pip install pillow==11.3.0
      - name: Download 18 distinct licensed Istanbul photographs
        run: python scripts/download_istanbul_backgrounds.py
      - name: Generate matching app launcher icon
        run: python scripts/create_launcher_icon.py
      - name: Generate original sound effects
        run: python3 scripts/generate_sounds.py
      - name: Get packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Build AAB
        run: flutter build appbundle --release
      - name: Publish Play icon
        uses: actions/upload-artifact@v4
        with:
          name: kelime-bul-play-icon
          path: assets/branding/kelime_bul_icon.png
      - name: Publish photo credits
        uses: actions/upload-artifact@v4
        with:
          name: istanbul-photo-credits
          path: assets/backgrounds/credits.json
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: kelime-rotalari-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish AAB
        uses: actions/upload-artifact@v4
        with:
          name: kelime-rotalari-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
